apiVersion: apps/v1
kind: Deployment
metadata:
  name: incendies-deployment
  labels:
    app: incendies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incendies
  template:
    metadata:
      labels:
        app: incendies
    spec:
      containers:
      - name: incendies
        image: thomasroussaux/app-mise-en-prod:v0.0.2
        ports:
        - containerPort: 8000
        env:
        - name: JETON_API
          valueFrom:
            secretKeyRef:
              name: api-jeton
              key: JETON_API
        - name: MLFLOW_TRACKING_URI
          value: "https://user-cdestouesse-mlflow.user.lab.sspcloud.fr"
        - name: MLFLOW_TRACKING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: MLFLOW_TRACKING_USERNAME
        - name: MLFLOW_TRACKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: MLFLOW_TRACKING_PASSWORD
        envFrom:
        - secretRef:
        
            name: s3-credentials